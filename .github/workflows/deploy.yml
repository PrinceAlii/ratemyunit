name: Deploy

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false  # Never cancel mid-flight deployments

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: '1.14.4'

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            infra:
              - 'terraform/**'
              - '.github/workflows/deploy.yml'
            backend:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
            frontend:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'

  infra-plan:
    name: Terraform Plan
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init Cache
        uses: actions/cache@v4
        with:
          path: terraform/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/*.tf', 'terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        id: plan
        run: terraform plan -out=main.tfplan
        working-directory: terraform

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/main.tfplan
          retention-days: 7

  infra-apply:
    name: Terraform Apply
    needs: [changes, infra-plan]
    if: (needs.changes.outputs.infra == 'true' && github.event_name == 'push')
    runs-on: ubuntu-latest
    environment: production
    outputs:
      ecr_repository: ${{ steps.tf-out.outputs.ecr_repository_url }}
      api_public_ip: ${{ steps.tf-out.outputs.api_public_ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init Cache
        uses: actions/cache@v4
        with:
          path: terraform/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/*.tf', 'terraform/.terraform.lock.hcl') }}

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve main.tfplan
        working-directory: terraform

      - name: Get Terraform Outputs
        id: tf-out
        working-directory: terraform
        run: |
          echo "ecr_repository_url=$(terraform output -raw ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "api_public_ip=$(terraform output -raw api_public_ip)" >> $GITHUB_OUTPUT

  deploy-backend:
    name: Deploy API + Frontend
    needs: [changes, infra-apply]
    if: |
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.infra == 'true') &&
      github.event_name == 'push' &&
      (always() && (needs.infra-apply.result == 'success' || needs.infra-apply.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/ratemyunit-api:latest
            ${{ steps.login-ecr.outputs.registry }}/ratemyunit-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Resend API Key in SSM
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "Updating Resend API key in SSM Parameter Store..."
            aws ssm put-parameter \
              --name "/ratemyunit/production/resend/api_key" \
              --type "SecureString" \
              --value "$RESEND_API_KEY" \
              --overwrite \
              --region ${{ env.AWS_REGION }}
            echo "✓ Resend API key updated successfully"
          else
            echo "⚠ RESEND_API_KEY secret not set - emails will fall back to console logging"
          fi

      - name: Update Resend Sender Identity in SSM
        env:
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          if [ -n "$RESEND_FROM_NAME" ]; then
            aws ssm put-parameter \
              --name "/ratemyunit/production/resend/from_name" \
              --type "String" \
              --value "$RESEND_FROM_NAME" \
              --overwrite \
              --region ${{ env.AWS_REGION }}
            echo "✓ Resend from name updated"
          else
            echo "ℹ RESEND_FROM_NAME secret not set - using app default"
          fi

          if [ -n "$RESEND_FROM_EMAIL" ]; then
            aws ssm put-parameter \
              --name "/ratemyunit/production/resend/from_email" \
              --type "String" \
              --value "$RESEND_FROM_EMAIL" \
              --overwrite \
              --region ${{ env.AWS_REGION }}
            echo "✓ Resend from email updated"
          else
            echo "ℹ RESEND_FROM_EMAIL secret not set - using app default"
          fi

      - name: Tag Current Version for Rollback
        id: backup
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=ratemyunit-api" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]]; then
            # Get current running image
            CURRENT_IMAGE=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids "$INSTANCE_ID" \
              --parameters 'commands=["docker inspect ratemyunit-api --format=\"{{.Image}}\" 2>/dev/null || echo none"]' \
              --query 'Command.CommandId' \
              --output text)

            # Wait and get result
            sleep 5
            BACKUP_IMAGE=$(aws ssm get-command-invocation \
              --command-id "$CURRENT_IMAGE" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' \
              --output text | tr -d '[:space:]')

            if [[ -n "$BACKUP_IMAGE" && "$BACKUP_IMAGE" != "none" ]]; then
              echo "backup_image=$BACKUP_IMAGE" >> $GITHUB_OUTPUT
              echo "✓ Tagged backup image: $BACKUP_IMAGE"
            else
              echo "⚠ No existing container found (likely first deployment)"
              echo "backup_image=none" >> $GITHUB_OUTPUT
            fi
          else
            echo "backup_image=none" >> $GITHUB_OUTPUT
          fi

      # Pre-deployment migrations: Run migrations on the OLD container before deploying
      # This ensures the database is ready for the new code
      # NOTE: Migration scripts use .mjs (ES modules) from scripts/ directory
      # Seed script uses .js (transpiled) from dist/ directory
      # This is intentional - migrations are run directly, seeding is built first
      - name: Run Database Migrations
        run: |
          # Resolve instance ID
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=ratemyunit-api" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "⚠ No running instance found, skipping pre-deployment migrations"
            exit 0
          fi

          echo "Running migrations on instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters 'commands=["export DATABASE_URL=$(aws ssm get-parameter --name /ratemyunit/production/database/url --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }})", "timeout 90s docker exec -e DATABASE_URL=\"$DATABASE_URL\" ratemyunit-api node /app/packages/db/scripts/apply-migrations.mjs 2>&1 || echo \"Container not running, migration failed, or migration timed out; will migrate after deployment\""]' \
            --comment "Running database migrations" \
            --timeout-seconds 180 \
            --query 'Command.CommandId' \
            --output text)

          echo "Migration command ID: $COMMAND_ID"

          # Wait for command to complete (allow up to ~3 minutes)
          STATUS="Pending"
          TERMINAL_STATUSES_REGEX='^(Success|Failed|TimedOut|Cancelled|DeliveryTimedOut|Undeliverable|Terminated)$'
          for i in {1..60}; do
            STATUS_RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/tmp/ssm-status-error || true)

            if [[ -n "$STATUS_RESULT" ]]; then
              STATUS="$STATUS_RESULT"
            elif grep -qi 'InvocationDoesNotExist\|InvalidCommandId' /tmp/ssm-status-error; then
              STATUS="Pending"
            else
              echo "⚠ Failed to fetch migration status from SSM (attempt $i/60)"
              cat /tmp/ssm-status-error
              STATUS="Unknown"
            fi

            echo "Pre-deployment migration status: $STATUS ($i/60)"

            if [[ "$STATUS" =~ $TERMINAL_STATUSES_REGEX ]]; then
              break
            fi

            sleep 2
          done

          if [[ "$STATUS" == "Pending" || "$STATUS" == "InProgress" || "$STATUS" == "Delayed" || "$STATUS" == "Unknown" ]]; then
            echo "Cancelling lingering pre-deployment migration command to avoid blocking deployment..."
            aws ssm cancel-command \
              --command-id "$COMMAND_ID" \
              --region ${{ env.AWS_REGION }} || true
          fi

          if [[ "$STATUS" == "Success" ]]; then
            echo "✓ Pre-deployment migrations completed successfully"
          else
            # Pre-deployment migration is a best-effort optimization.
            # Continue deployment and rely on post-deployment migration handling.
            echo "⚠ Pre-deployment migrations did not complete successfully (status: $STATUS). Continuing deployment."
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text || true

      # Deploy new container: Stop old, start new
      # Uses SSM to execute commands on EC2 without SSH access
      - name: Deploy to EC2 via SSM
        run: |
          # Resolve instance ID first
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=ratemyunit-api" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "✗ Cannot resolve EC2 instance for deployment" && exit 1
          fi

          echo "Deploying to instance: $INSTANCE_ID"

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters 'commands=["set -e", "EXISTING=$(docker ps -aq --filter name=^ratemyunit-api$)", "HAD_EXISTING=false", "if [ -n \"$EXISTING\" ]; then HAD_EXISTING=true; fi", "echo \"Cleaning up disk space...\"", "docker system prune -af", "echo \"Cleaning up existing containers...\"", "if [ -n \"$EXISTING\" ]; then echo \"Found container: $EXISTING\"; docker update --restart=no $EXISTING; docker stop $EXISTING; docker rm -f $EXISTING; echo \"Container removed\"; else echo \"No existing container\"; fi", "docker ps -a --filter name=ratemyunit-api", "echo \"Loading environment variables from SSM...\"", "export DATABASE_URL=$(aws ssm get-parameter --name /ratemyunit/production/database/url --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }})", "export REDIS_URL=$(aws ssm get-parameter --name /ratemyunit/production/redis/url --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }})", "export JWT_SECRET=$(aws ssm get-parameter --name /ratemyunit/production/jwt/secret --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }})", "export FRONTEND_URL=$(aws ssm get-parameter --name /ratemyunit/production/frontend/url --query Parameter.Value --output text --region ${{ env.AWS_REGION }})", "export GUEST_REVIEW_IP_HASH_SALT=$(aws ssm get-parameter --name /ratemyunit/production/security/guest_review_ip_hash_salt --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }})", "export TRUSTED_PROXY_CIDRS=$(aws ssm get-parameter --name /ratemyunit/production/network/trusted_proxy_cidrs --query Parameter.Value --output text --region ${{ env.AWS_REGION }})", "export RESEND_API_KEY=$(aws ssm get-parameter --name /ratemyunit/production/resend/api_key --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo \"\")", "export RESEND_FROM_NAME=$(aws ssm get-parameter --name /ratemyunit/production/resend/from_name --query Parameter.Value --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo \"RateMyUnit\")", "export RESEND_FROM_EMAIL=$(aws ssm get-parameter --name /ratemyunit/production/resend/from_email --query Parameter.Value --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo \"verify@send.ratemyunit.dev\")", "echo \"Validating required environment variables...\"", "if [ -z \"$DATABASE_URL\" ] || [ \"$DATABASE_URL\" = \"None\" ]; then echo \"ERROR: DATABASE_URL is not set or invalid\"; exit 1; fi", "if [ -z \"$REDIS_URL\" ] || [ \"$REDIS_URL\" = \"None\" ]; then echo \"ERROR: REDIS_URL is not set or invalid\"; exit 1; fi", "if [ -z \"$JWT_SECRET\" ] || [ \"$JWT_SECRET\" = \"None\" ]; then echo \"ERROR: JWT_SECRET is not set or invalid\"; exit 1; fi", "if [ -z \"$FRONTEND_URL\" ] || [ \"$FRONTEND_URL\" = \"None\" ]; then echo \"ERROR: FRONTEND_URL is not set or invalid\"; exit 1; fi", "if [ -z \"$GUEST_REVIEW_IP_HASH_SALT\" ] || [ \"$GUEST_REVIEW_IP_HASH_SALT\" = \"None\" ]; then echo \"ERROR: GUEST_REVIEW_IP_HASH_SALT is not set or invalid\"; exit 1; fi", "if [ -z \"$TRUSTED_PROXY_CIDRS\" ] || [ \"$TRUSTED_PROXY_CIDRS\" = \"None\" ]; then echo \"ERROR: TRUSTED_PROXY_CIDRS is not set or invalid\"; exit 1; fi", "echo \"✓ All required environment variables validated\"", "aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}", "docker pull ${{ steps.login-ecr.outputs.registry }}/ratemyunit-api:${{ github.sha }}", "echo \"Checking if this is first deployment...\"", "FIRST_DEPLOY=false", "if [ \"$HAD_EXISTING\" = \"false\" ]; then echo \"First deployment detected - will seed database\"; FIRST_DEPLOY=true; fi", "echo \"Starting new container...\"", "docker run -d --name ratemyunit-api --network ratemyunit-net --restart unless-stopped -p 80:3000 -e NODE_ENV=production -e PORT=3000 -e DATABASE_URL=\"$DATABASE_URL\" -e REDIS_URL=\"$REDIS_URL\" -e JWT_SECRET=\"$JWT_SECRET\" -e FRONTEND_URL=\"$FRONTEND_URL\" -e GUEST_REVIEW_IP_HASH_SALT=\"$GUEST_REVIEW_IP_HASH_SALT\" -e TRUSTED_PROXY_CIDRS=\"$TRUSTED_PROXY_CIDRS\" -e RESEND_API_KEY=\"$RESEND_API_KEY\" -e RESEND_FROM_NAME=\"$RESEND_FROM_NAME\" -e RESEND_FROM_EMAIL=\"$RESEND_FROM_EMAIL\" -e FIRST_DEPLOY=\"$FIRST_DEPLOY\" -e AUTO_SEED=false ${{ steps.login-ecr.outputs.registry }}/ratemyunit-api:${{ github.sha }}", "echo \"Deployment complete!\"", "docker ps --filter name=ratemyunit-api"]' \
            --comment "Deploying backend" \
            --query 'Command.CommandId' \
            --output text)

          echo "Deployment command ID: $COMMAND_ID"

          # Wait for deployment to complete (timeout after 15 minutes)
          STATUS="Pending"
          TERMINAL_STATUSES_REGEX='^(Success|Failed|TimedOut|Cancelled|DeliveryTimedOut|Undeliverable|Terminated)$'
          for i in {1..180}; do
            STATUS_RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/tmp/ssm-status-error || true)

            if [[ -n "$STATUS_RESULT" ]]; then
              STATUS="$STATUS_RESULT"
            elif grep -qi 'InvocationDoesNotExist\|InvalidCommandId' /tmp/ssm-status-error; then
              STATUS="Pending"
            else
              echo "✗ Failed to fetch deployment status from SSM"
              cat /tmp/ssm-status-error
              exit 1
            fi

            echo "Deployment command status: $STATUS ($i/180)"

            if [[ "$STATUS" == "Success" ]]; then
              echo "✓ Deployment completed successfully"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text || true
              break
            elif [[ "$STATUS" =~ $TERMINAL_STATUSES_REGEX ]]; then
              echo "✗ Deployment failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text || true
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              exit 1
            fi

            sleep 5
          done

          if [[ "$STATUS" != "Success" ]]; then
            echo "✗ Deployment timed out after 15 minutes (last status: $STATUS)"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text || true
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' \
              --output text || true
            exit 1
          fi

      - name: Wait for Container to Start
        run: |
          echo "Waiting for container to be ready..."
          sleep 10
          INSTANCE_ID="None"
          attempt=0
          until [[ -n "$INSTANCE_ID" && "$INSTANCE_ID" != "None" ]]; do
            DESCRIBE_RESULT=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Name,Values=ratemyunit-api" \
                "Name=instance-state-name,Values=running,pending,stopping,stopped" \
              --query 'Reservations[0].Instances[0]' \
              --output json)
            INSTANCE_ID=$(echo "$DESCRIBE_RESULT" | jq -r '.InstanceId // empty')
            INSTANCE_STATE=$(echo "$DESCRIBE_RESULT" | jq -r '.State.Name // empty')
            attempt=$((attempt + 1))
            if [[ $attempt -ge 60 ]]; then
              echo "✗ Unable to resolve EC2 instance ID"
              echo "EC2 describe output:"
              echo "$DESCRIBE_RESULT"
              exit 1
            fi
            sleep 5
          done

          if [[ "$INSTANCE_STATE" != "running" ]]; then
            if [[ "$INSTANCE_STATE" == "stopped" ]]; then
              echo "Instance is stopped. Starting..."
              aws ec2 start-instances --instance-ids "$INSTANCE_ID"
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              echo "✓ Instance is now running"
            elif [[ "$INSTANCE_STATE" == "stopping" || "$INSTANCE_STATE" == "pending" ]]; then
              echo "Instance is in transitional state: $INSTANCE_STATE. Waiting..."
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              echo "✓ Instance is now running"
            else
              echo "✗ Instance is in unexpected state: $INSTANCE_STATE"
              exit 1
            fi
          fi

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters 'commands=["docker ps --filter name=ratemyunit-api --format \"{{.Status}}\""]' \
            --comment "Verify container started (${INSTANCE_ID})" \
            --query 'Command.CommandId' \
            --output text)

          STATUS="Pending"
          for i in {1..60}; do
            STATUS_RESULT=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/tmp/ssm-status-error || true)

            if [[ -n "$STATUS_RESULT" ]]; then
              STATUS="$STATUS_RESULT"
            elif grep -qi 'InvocationDoesNotExist\|InvalidCommandId' /tmp/ssm-status-error; then
              STATUS="Pending"
            else
              echo "✗ Failed to fetch container startup status from SSM"
              cat /tmp/ssm-status-error
              exit 1
            fi

            if [[ "$STATUS" == "Success" || "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" ]]; then
              break
            fi

            echo "Waiting for container verification... ($i/60)"
            sleep 1
          done

          echo "Command invocation status: $STATUS"

          if [[ "$STATUS" != "Success" ]]; then
            echo "✗ Container verification command did not succeed"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text

      # Post-deployment migrations: Run any new migrations in the NEW container
      # This handles migrations that can only run after the new code is deployed
      - name: Run Post-Deployment Migrations
        run: |
          echo "Post-deployment migrations are handled by the application startup flow."
          echo "Skipping explicit SSM post-deployment migration command."

      # Database seeding: Handled automatically by container entrypoint if FIRST_DEPLOY=true or AUTO_SEED=true
      # Set FIRST_DEPLOY=true in the docker run command for initial deployments
      - name: Seed Database
        run: |
          echo "✓ Database seeding is handled automatically by the container entrypoint"
          echo "  - Set FIRST_DEPLOY=true in docker run for initial deployment"
          echo "  - Set AUTO_SEED=true to always seed on startup"

      - name: Health Check
        run: |
          echo "Running health check on deployed application..."

          # Resolve instance ID
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=ratemyunit-api" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "✗ Cannot resolve EC2 instance for health check"
            exit 1
          fi

          echo "Running health check on instance: $INSTANCE_ID"

          # Wait for app to be ready and check health via SSM (checking localhost from inside EC2)
          for i in {1..30}; do
            COMMAND_ID=$(aws ssm send-command \
              --document-name "AWS-RunShellScript" \
              --instance-ids "$INSTANCE_ID" \
              --parameters 'commands=["code=$(curl --max-time 5 -s -o /dev/null -w \"%{http_code}\" http://localhost/health 2>/dev/null || true); echo ${code:-000}"]' \
              --query 'Command.CommandId' \
              --output text)

            # Wait for SSM command to complete (timeout after 30 seconds)
            CMD_STATUS="Pending"
            for j in {1..30}; do
              CMD_STATUS=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              if [[ "$CMD_STATUS" == "Success" || "$CMD_STATUS" == "Failed" ]]; then
                break
              fi
              sleep 1
            done

            # Only read output if command completed successfully
            if [[ "$CMD_STATUS" == "Success" ]]; then
              HTTP_CODE=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text 2>/dev/null | tr -d '[:space:]')

              if [[ "$HTTP_CODE" == "200" ]]; then
                echo "✓ Application is healthy (HTTP $HTTP_CODE)"

                # Get health check details
                DETAIL_CMD=$(aws ssm send-command \
                  --document-name "AWS-RunShellScript" \
                  --instance-ids "$INSTANCE_ID" \
                  --parameters 'commands=["curl -s http://localhost/health"]' \
                  --query 'Command.CommandId' \
                  --output text)

                # Wait for details command to complete
                for k in {1..10}; do
                  DETAIL_STATUS=$(aws ssm get-command-invocation \
                    --command-id "$DETAIL_CMD" \
                    --instance-id "$INSTANCE_ID" \
                    --query 'Status' \
                    --output text 2>/dev/null || echo "Pending")
                  if [[ "$DETAIL_STATUS" == "Success" ]]; then
                    break
                  fi
                  sleep 1
                done

                if [[ "$DETAIL_STATUS" == "Success" ]]; then
                  aws ssm get-command-invocation \
                    --command-id "$DETAIL_CMD" \
                    --instance-id "$INSTANCE_ID" \
                    --query 'StandardOutputContent' \
                    --output text
                fi

                exit 0
              fi

              echo "Health check attempt $i/30 (HTTP $HTTP_CODE)..."
            else
              echo "Health check attempt $i/30 (SSM command status: $CMD_STATUS)..."
            fi

            sleep 10
          done

          echo "✗ Health check failed after 5 minutes"
          exit 1

      - name: Rollback on Failure
        if: failure() && steps.backup.outputs.backup_image != 'none'
        run: |
          echo "🔄 Rolling back to previous version: ${{ steps.backup.outputs.backup_image }}"

          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Name,Values=ratemyunit-api" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "✗ Cannot resolve EC2 instance for rollback"
            exit 1
          fi

          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$INSTANCE_ID" \
            --parameters "commands=[\"set -e\", \"echo \\\"Rolling back - cleaning up failed deployment...\\\"\", \"EXISTING=\$(docker ps -aq --filter name=^ratemyunit-api\$)\", \"if [ -n \\\"\$EXISTING\\\" ]; then docker update --restart=no \$EXISTING; docker stop \$EXISTING; docker rm -f \$EXISTING; fi\", \"export DATABASE_URL=\$(aws ssm get-parameter --name /ratemyunit/production/database/url --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }})\", \"export REDIS_URL=\$(aws ssm get-parameter --name /ratemyunit/production/redis/url --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }})\", \"export JWT_SECRET=\$(aws ssm get-parameter --name /ratemyunit/production/jwt/secret --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }})\", \"export FRONTEND_URL=\$(aws ssm get-parameter --name /ratemyunit/production/frontend/url --query Parameter.Value --output text --region ${{ env.AWS_REGION }})\", \"export GUEST_REVIEW_IP_HASH_SALT=\$(aws ssm get-parameter --name /ratemyunit/production/security/guest_review_ip_hash_salt --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }})\", \"export TRUSTED_PROXY_CIDRS=\$(aws ssm get-parameter --name /ratemyunit/production/network/trusted_proxy_cidrs --query Parameter.Value --output text --region ${{ env.AWS_REGION }})\", \"export RESEND_API_KEY=\$(aws ssm get-parameter --name /ratemyunit/production/resend/api_key --with-decryption --query Parameter.Value --output text --region ${{ env.AWS_REGION }})\", \"export RESEND_FROM_NAME=\$(aws ssm get-parameter --name /ratemyunit/production/resend/from_name --query Parameter.Value --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo RateMyUnit)\", \"export RESEND_FROM_EMAIL=\$(aws ssm get-parameter --name /ratemyunit/production/resend/from_email --query Parameter.Value --output text --region ${{ env.AWS_REGION }} 2>/dev/null || echo verify@send.ratemyunit.dev)\", \"docker run -d --name ratemyunit-api --network ratemyunit-net --restart unless-stopped -p 80:3000 -e NODE_ENV=production -e PORT=3000 -e DATABASE_URL=\\\"\$DATABASE_URL\\\" -e REDIS_URL=\\\"\$REDIS_URL\\\" -e JWT_SECRET=\\\"\$JWT_SECRET\\\" -e FRONTEND_URL=\\\"\$FRONTEND_URL\\\" -e GUEST_REVIEW_IP_HASH_SALT=\\\"\$GUEST_REVIEW_IP_HASH_SALT\\\" -e TRUSTED_PROXY_CIDRS=\\\"\$TRUSTED_PROXY_CIDRS\\\" -e RESEND_API_KEY=\\\"\$RESEND_API_KEY\\\" -e RESEND_FROM_NAME=\\\"\$RESEND_FROM_NAME\\\" -e RESEND_FROM_EMAIL=\\\"\$RESEND_FROM_EMAIL\\\" ${{ steps.backup.outputs.backup_image }}\"]" \
            --comment "Rolling back deployment"

          echo "✓ Rollback initiated"
          exit 1

      - name: Notify Deployment Status
        if: always()
        run: |
          if [[ "${{ job.status }}" == "success" ]]; then
            EMOJI="✅"
            STATUS="succeeded"
            COLOR="good"
          else
            EMOJI="❌"
            STATUS="failed"
            COLOR="danger"
          fi

          echo "${EMOJI} Deployment ${STATUS} for commit ${{ github.sha }}"
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
