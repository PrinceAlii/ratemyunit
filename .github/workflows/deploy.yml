name: Deploy

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-2
  TF_VERSION: '1.14.4'
  APP_IMAGE_NAME: ratemyunit-api
  POSTGRES_IMAGE: postgres:18.3-alpine
  REDIS_IMAGE: redis:8.4.1-alpine

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4.0.1
        id: filter
        with:
          filters: |
            infra:
              - 'terraform/**'
              - '.github/workflows/deploy.yml'
              - '.github/scripts/**'
            backend:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/scripts/**'
            frontend:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'package-lock.json'

  infra-plan:
    name: Terraform Plan
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init Cache
        uses: actions/cache@v4
        with:
          path: terraform/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/*.tf', 'terraform/.terraform.lock.hcl') }}
          restore-keys: |
            ${{ runner.os }}-terraform-

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan -out=main.tfplan
        working-directory: terraform

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/main.tfplan
          retention-days: 7

  infra-apply:
    name: Terraform Apply
    needs: [changes, infra-plan]
    if: needs.changes.outputs.infra == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init Cache
        uses: actions/cache@v4
        with:
          path: terraform/.terraform
          key: ${{ runner.os }}-terraform-${{ hashFiles('terraform/*.tf', 'terraform/.terraform.lock.hcl') }}

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve main.tfplan
        working-directory: terraform

  deploy-backend:
    name: Deploy API + Frontend
    needs: [changes, infra-apply]
    if: |
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.infra == 'true') &&
      github.event_name == 'push' &&
      (always() && (needs.infra-apply.result == 'success' || needs.infra-apply.result == 'skipped'))
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2.1.2

      - name: Set image reference
        id: image
        run: |
          IMAGE_REF="${{ steps.login-ecr.outputs.registry }}/${{ env.APP_IMAGE_NAME }}:${{ github.sha }}"
          echo "image_ref=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      - name: Build and Push ARM64 Docker Image
        uses: docker/build-push-action@v7.1.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.APP_IMAGE_NAME }}:latest
            ${{ steps.image.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://ratemyunit.dev

      - name: Verify pushed image is ARM64
        run: |
          docker buildx imagetools inspect "${{ steps.image.outputs.image_ref }}" | tee /tmp/imagetools.txt
          grep -q "linux/arm64" /tmp/imagetools.txt

      - name: Update Resend API Key in SSM
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            aws ssm put-parameter \
              --name "/ratemyunit/production/resend/api_key" \
              --type "SecureString" \
              --value "$RESEND_API_KEY" \
              --overwrite \
              --region "${{ env.AWS_REGION }}"
          fi

      - name: Update Resend Sender Identity in SSM
        env:
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        run: |
          if [ -n "$RESEND_FROM_NAME" ]; then
            aws ssm put-parameter \
              --name "/ratemyunit/production/resend/from_name" \
              --type "String" \
              --value "$RESEND_FROM_NAME" \
              --overwrite \
              --region "${{ env.AWS_REGION }}"
          fi

          if [ -n "$RESEND_FROM_EMAIL" ]; then
            aws ssm put-parameter \
              --name "/ratemyunit/production/resend/from_email" \
              --type "String" \
              --value "$RESEND_FROM_EMAIL" \
              --overwrite \
              --region "${{ env.AWS_REGION }}"
          fi

      - name: Resolve EC2 instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region "${{ env.AWS_REGION }}" \
            --filters \
              "Name=tag:Name,Values=ratemyunit-api" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text)

          if [[ -z "$INSTANCE_ID" || "$INSTANCE_ID" == "None" ]]; then
            echo "Failed to resolve EC2 instance" >&2
            exit 1
          fi

          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Record rollback image
        id: backup
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          COMMANDS_JSON=$(python - <<'PY'
          import json
          command = r'''
          image_id=$(docker inspect --format '{{.Image}}' ratemyunit-api 2>/dev/null || true)
          if [ -z "$image_id" ]; then
            echo none
            exit 0
          fi

          repo_digest=$(docker image inspect "$image_id" --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{end}}' 2>/dev/null || true)
          if [ -n "$repo_digest" ]; then
            echo "$repo_digest"
            exit 0
          fi

          image_ref=$(docker inspect --format '{{index .Config.Image}}' ratemyunit-api 2>/dev/null || true)
          if [ -n "$image_ref" ]; then
            echo "$image_ref"
          else
            echo none
          fi
          '''
          print(json.dumps({"commands": [command]}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$COMMANDS_JSON" \
            --query 'Command.CommandId' \
            --output text)

          sleep 4
          BACKUP_IMAGE=$(aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text | tr -d '[:space:]')

          if [[ -z "$BACKUP_IMAGE" ]]; then
            BACKUP_IMAGE="none"
          fi

          echo "backup_image=$BACKUP_IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          IMAGE_REF: ${{ steps.image.outputs.image_ref }}
        run: |
          COMMANDS_JSON=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          script = Path(".github/scripts/deploy-ec2.sh").read_text()
          command = (
            "cat <<'SCRIPT' >/tmp/ratemyunit-deploy.sh\n"
            f"{script}\n"
            "SCRIPT\n"
            "chmod +x /tmp/ratemyunit-deploy.sh\n"
            f"AWS_REGION='{os.environ['AWS_REGION']}' "
            f"IMAGE_REF='{os.environ['IMAGE_REF']}' "
            f"POSTGRES_IMAGE='{os.environ['POSTGRES_IMAGE']}' "
            f"REDIS_IMAGE='{os.environ['REDIS_IMAGE']}' "
            "/tmp/ratemyunit-deploy.sh"
          )
          print(json.dumps({"commands": [command]}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$COMMANDS_JSON" \
            --comment "Deploying ARM64 application image" \
            --query 'Command.CommandId' \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          for i in {1..90}; do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "Deploy status: $STATUS ($i/90)"
            if [[ "$STATUS" == "Success" ]]; then
              aws ssm get-command-invocation \
                --region "${{ env.AWS_REGION }}" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            fi
            if [[ "$STATUS" =~ ^(Failed|TimedOut|Cancelled|DeliveryTimedOut|Undeliverable|Terminated)$ ]]; then
              aws ssm get-command-invocation \
                --region "${{ env.AWS_REGION }}" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text || true
              aws ssm get-command-invocation \
                --region "${{ env.AWS_REGION }}" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text || true
              exit 1
            fi
            sleep 5
          done

          echo "Deployment timed out" >&2
          exit 1

      - name: Health Check
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
        run: |
          COMMANDS_JSON=$(python - <<'PY'
          import json
          from pathlib import Path

          script = Path(".github/scripts/health-check-ec2.sh").read_text()
          command = (
            "cat <<'SCRIPT' >/tmp/ratemyunit-health.sh\n"
            f"{script}\n"
            "SCRIPT\n"
            "chmod +x /tmp/ratemyunit-health.sh\n"
            "/tmp/ratemyunit-health.sh"
          )
          print(json.dumps({"commands": [command]}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$COMMANDS_JSON" \
            --comment "Validating deployed application health" \
            --query 'Command.CommandId' \
            --output text)

          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --region "${{ env.AWS_REGION }}" \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "Health check status: $STATUS ($i/60)"
            if [[ "$STATUS" == "Success" ]]; then
              aws ssm get-command-invocation \
                --region "${{ env.AWS_REGION }}" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            fi
            if [[ "$STATUS" =~ ^(Failed|TimedOut|Cancelled|DeliveryTimedOut|Undeliverable|Terminated)$ ]]; then
              aws ssm get-command-invocation \
                --region "${{ env.AWS_REGION }}" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text || true
              aws ssm get-command-invocation \
                --region "${{ env.AWS_REGION }}" \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text || true
              exit 1
            fi
            sleep 3
          done

          echo "Health check timed out" >&2
          exit 1

      - name: Rollback on Failure
        if: failure() && steps.backup.outputs.backup_image != 'none'
        env:
          INSTANCE_ID: ${{ steps.ec2.outputs.instance_id }}
          BACKUP_IMAGE_REF: ${{ steps.backup.outputs.backup_image }}
        run: |
          COMMANDS_JSON=$(python - <<'PY'
          import json
          import os
          from pathlib import Path

          script = Path(".github/scripts/rollback-ec2.sh").read_text()
          command = (
            "cat <<'SCRIPT' >/tmp/ratemyunit-rollback.sh\n"
            f"{script}\n"
            "SCRIPT\n"
            "chmod +x /tmp/ratemyunit-rollback.sh\n"
            f"AWS_REGION='{os.environ['AWS_REGION']}' "
            f"BACKUP_IMAGE_REF='{os.environ['BACKUP_IMAGE_REF']}' "
            "/tmp/ratemyunit-rollback.sh"
          )
          print(json.dumps({"commands": [command]}))
          PY
          )

          COMMAND_ID=$(aws ssm send-command \
            --region "${{ env.AWS_REGION }}" \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters "$COMMANDS_JSON" \
            --comment "Rolling back deployment failure" \
            --query 'Command.CommandId' \
            --output text)

          sleep 5
          aws ssm get-command-invocation \
            --region "${{ env.AWS_REGION }}" \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text || true

      - name: Notify Deployment Status
        if: always()
        run: |
          echo "Deployment status: ${{ job.status }}"
